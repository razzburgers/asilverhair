name: Publish A Silver Hair

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Deploy full queue for testing (normally false)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "5 10 * * 1,3,6"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build scheduled publication
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            python3 build_site.py --all
          else
            python3 build_site.py
          fi
      - name: Record scheduled publication state
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if ! git diff --quiet -- publisher/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publisher/state.json
            git commit -m "Record scheduled publication state"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
